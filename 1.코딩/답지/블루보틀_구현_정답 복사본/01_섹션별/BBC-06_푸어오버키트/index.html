<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../image/logo.svg">
  <title>블루보틀 코리아 | BBC-06 푸어오버키트</title>
  <!-- 모나미 수업 문법으로 구성한 PC 화면 복습용 정답입니다. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- ============================================================
      BBC-06 시작: 푸어오버키트
      참고: 1코딩/모나미/index.html · style.css
      학습: 위쪽 2칸 배치와 아래쪽 3칸 배치를 구분하는 부모·자식 구조
      구간 번호는 전체 통합본·섹션별 정답에서 동일합니다.
    ============================================================ -->
    <div id="BBC-06">
      <div class="kit">
        <div class="con kit-con">
          <div class="kit-top">
            <div class="kit-copy">
              <span>온라인 스토어 단독</span>
              <h2>푸어 오버 키트를</h2>
              <h2>만나보세요</h2>
              <p>집에서도 한 잔의 커피를 정성스럽게.</p>
              <a href="https://kr.bluebottlecoffee.com/" target="_blank" title="블루보틀 원본 사이트 보기">푸어 오버 키트 보기 →</a>
            </div>
            <img class="kit-photo" src="../../image/pour-over.jpg" alt="드리퍼와 카라페를 사용한 커피 테이블">
          </div>
          <div class="kit-row">
            <div class="kit-card">
              <img src="../../image/pour-dripper.png" alt="커피 드리퍼">
              <h3>커피 드리퍼</h3>
              <p>최상의 푸어 오버를 위한 정교한 디자인</p>
            </div>
            <div class="kit-card">
              <img src="../../image/pour-carafe.png" alt="커피 카라페">
              <h3>커피 카라페</h3>
              <p>드리퍼와 함께 편리하게 사용하는 사이즈</p>
            </div>
            <div class="kit-card">
              <img src="../../image/pour-filter.png" alt="커피 필터">
              <h3>커피 필터</h3>
              <p>블루보틀의 노하우를 담은 독창적 디자인</p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- BBC-06 끝 -->
  </main>
</body>
</html>
