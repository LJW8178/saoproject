<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../../image/logo.png">
  <title>오설록 | OSU-05 추천홍차</title>
  <!-- 모나미 수업 문법으로 구성한 PC 화면 복습용 정답입니다. -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <!-- ============================================================
      OSU-05 시작: 추천홍차
      참고: 1코딩/모나미/index.html · style.css
      학습: 큰 왼쪽 콘텐츠와 오른쪽 2행·2칸 상품의 중첩 Flexbox
      구간 번호는 전체 통합본·섹션별 정답에서 동일합니다.
    ============================================================ -->
    <div id="OSU-05">
      <div class="tea-feature">
        <div class="con tea-con">
          <div class="tea-story">
            <img src="../../image/theme-banner.jpg" alt="단풍과 어울리는 오설록 홍차">
            <div class="tea-story-copy"><span>TEA FOR YOUR AUTUMN</span><h2>붉게 물든 10월의 단풍과</h2><h2>어울리는 홍차</h2><p>깊어진 계절의 향을 한 잔에 담아보세요.</p></div>
          </div>
          <div class="tea-products">
            <div class="tea-row">
              <div class="tea-card">
                <img src="../../image/tea-01.png" alt="마롱 크림 블랙티 20입">
                <h3>마롱 크림 블랙티 20입</h3>
                <p class="original-price">정상가 27,000원</p>
                <div class="price-row"><span class="discount">50%</span><span class="sale-price">13,500원</span></div>
              </div>
              <div class="tea-card">
                <img src="../../image/tea-02.png" alt="무화과 애플 블랙티 20입">
                <h3>무화과 애플 블랙티 20입</h3>
                <p class="original-price">정상가 27,000원</p>
                <div class="price-row"><span class="discount">20%</span><span class="sale-price">21,600원</span></div>
              </div>
            </div>
            <div class="tea-row">
              <div class="tea-card">
                <img src="../../image/tea-03.png" alt="시그니처 얼그레이 20입">
                <h3>시그니처 얼그레이 20입</h3>
                <p class="original-price">정상가 27,000원</p>
                <div class="price-row"><span class="discount">20%</span><span class="sale-price">21,600원</span></div>
              </div>
              <div class="tea-card">
                <img src="../../image/tea-04.png" alt="피치 파파야 블랙티 10입">
                <h3>피치 파파야 블랙티 10입</h3>
                <p class="original-price">정상가 16,500원</p>
                <div class="price-row"><span class="discount">15%</span><span class="sale-price">14,025원</span></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <!-- OSU-05 끝 -->
  </main>
</body>
</html>
